name: DCB release record stage check

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer x.y.z release version
        required: true
        type: string
      state:
        description: Closed release-record stage to validate
        required: true
        type: choice
        options:
          - prepared
          - library-tagged/incomplete
          - libraries-verified
          - template-tagged/incomplete
          - artifacts-verified
          - complete
      ref:
        description: 40-hex host pointer commit
        required: true
        type: string
      candidate:
        description: 40-hex child candidate commit to check out
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: dcb-release
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_STATE: ${{ inputs.state }}
      INPUT_REF: ${{ inputs.ref }}
      INPUT_CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Require main branch dispatch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "dcb_release_record_check.yml may only run on refs/heads/main (got ${GITHUB_REF})." >&2
            exit 1
          fi

      - name: Validate dispatch inputs
        run: |
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must match ^[0-9]+\\.[0-9]+\\.[0-9]+$." >&2
            exit 1
          }
          [[ "$INPUT_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "ref must be a 40-character host commit SHA." >&2
            exit 1
          }
          [[ "$INPUT_CANDIDATE" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "candidate must be a 40-character child commit SHA." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build release-record validator
        run: |
          dotnet restore dcb/tests/Sekiban.Dcb.TemplateValidation/Sekiban.Dcb.TemplateValidation.csproj -p:NuGetAudit=false
          dotnet build dcb/tests/Sekiban.Dcb.TemplateValidation/Sekiban.Dcb.TemplateValidation.csproj -c Release --no-restore --nologo

      - name: Read and validate release record at stage
        env:
          GH_TOKEN: ${{ secrets.SEKIBAN_RELEASE_RECORD_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/dcb-release-record-bundle"
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/read-host-release-record.sh \
            --version "$INPUT_VERSION" --state "$INPUT_STATE" \
            --verify-tags none \
            --ref "$INPUT_REF" \
            --output-dir "$RUNNER_TEMP/dcb-release-record-bundle" \
            --manifest "$RUNNER_TEMP/dcb-release-record-bundle/bundle.json"
          dotnet dcb/tests/Sekiban.Dcb.TemplateValidation/bin/Release/net10.0/Sekiban.Dcb.TemplateValidation.dll \
            release-record --bundle "$RUNNER_TEMP/dcb-release-record-bundle" \
            --manifest "$RUNNER_TEMP/dcb-release-record-bundle/bundle.json" \
            --repo-root "$GITHUB_WORKSPACE" --expected-version "$INPUT_VERSION" \
            --state "$INPUT_STATE" \
            --merged-sha-output "$RUNNER_TEMP/validated-merged-sha.txt" \
            --release-facts-output "$RUNNER_TEMP/release-facts.json"
          MERGED_SHA="$(tr -d '\n' < "$RUNNER_TEMP/validated-merged-sha.txt")"
          test "$MERGED_SHA" = "$INPUT_CANDIDATE"
          test "$MERGED_SHA" = "$(git rev-parse 'HEAD^{commit}')"
