  net10SliceBCompatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node for browser gate
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.400
    - name: Assert exact SDK pin
      run: |
        expected="$(jq -r '.sdk.version' global.json)"
        actual="$(dotnet --version)"
        test "$actual" = "$expected"
    - name: Validate net10 slice B characterization
      run: |
        ./eng/validate-net10-slice-a.sh --repo-root "$GITHUB_WORKSPACE" --self-test
    - name: Validate 12-package public API compatibility
      run: |
        ./eng/validate-net10-api-compat.sh --repo-root "$GITHUB_WORKSPACE" --self-test
    - name: Validate bidirectional durable serialization
      run: |
        ./eng/validate-net10-serialization.sh --repo-root "$GITHUB_WORKSPACE" --self-test
    - name: Validate browser IndexedDb default runtime
      run: |
        ./eng/validate-net10-indexeddb-browser.sh --repo-root "$GITHUB_WORKSPACE" --self-test
