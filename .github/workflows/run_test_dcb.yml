name: Run DCB Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'dcb/src/Sekiban.Dcb.Core/**'
      - 'dcb/src/Sekiban.Dcb.Core.Model/**'
      - 'dcb/src/Sekiban.Dcb.WithResult/**'
      - 'dcb/src/Sekiban.Dcb.WithoutResult/**'
      - 'dcb/src/Sekiban.Dcb.Orleans.Core/**'
      - 'dcb/OrleansVersion.props'
      - 'dcb/Directory.Build.props'
      - 'dcb/src/Directory.Build.props'
      - 'dcb/src/Sekiban.Dcb.Orleans.WithResult/**'
      - 'dcb/src/Sekiban.Dcb.Orleans.WithoutResult/**'
      - 'dcb/src/Sekiban.Dcb.MaterializedView/**'
      - 'dcb/src/Sekiban.Dcb.MaterializedView.Postgres/**'
      - 'dcb/src/Sekiban.Dcb.MaterializedView.SqlServer/**'
      - 'dcb/src/Sekiban.Dcb.MaterializedView.MySql/**'
      - 'dcb/src/Sekiban.Dcb.MaterializedView.Sqlite/**'
      - 'dcb/src/Sekiban.Dcb.BlobStorage.AzureStorage/**'
      - 'dcb/src/Sekiban.Dcb.BlobStorage.S3/**'
      - 'dcb/src/Sekiban.Dcb.CosmosDb/**'
      - 'dcb/src/Sekiban.Dcb.DynamoDB/**'
      - 'dcb/src/Sekiban.Dcb.Postgres/**'
      - 'dcb/src/Sekiban.Dcb.Postgres.MigrationHost/**'
      - 'dcb/src/Sekiban.Dcb.Sqlite/**'
      - 'dcb/src/Sekiban.Dcb.ColdStorage/**'
      - 'dcb/tests/Sekiban.Dcb.Orleans.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.Postgres.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.MaterializedView.BinaryConsumer/**'
      - 'dcb/tests/Sekiban.Dcb.MaterializedView.ApiSurfaceVerifier/**'
      - 'dcb/tests/Sekiban.Dcb.MaterializedView.NewVersionConsumer/**'
      - 'dcb/tests/Sekiban.Dcb.MaterializedView.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.MaterializedView.MultiProvider.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.MaterializedView.Postgres.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.WithResult.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.WithoutResult.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.TagStateCancellation.Legacy1018Fixture/**'
      - 'dcb/tests/Sekiban.Dcb.ColdEvents.Tests/**'
      - 'dcb/tests/Sekiban.Dcb.BlobStorage.AzureStorage.Unit/**'
      - 'dcb/tests/Sekiban.Dcb.TemplateValidation/**'
      - 'templates/Sekiban.Dcb.Templates/content/*/SekibanDcbTemplateVersion.props'

concurrency:
  group: DcbTestWorkflow
  cancel-in-progress: false

jobs:
  dcbTestsNet9:
    runs-on: ubuntu-latest
    env:
      SEKIBAN_TAG_STREAM_CONTROLLED_CEILING: '1'
      SEKIBAN_DYNAMODB_LOCAL_ENDPOINT: http://127.0.0.1:18000
    concurrency:
      group: dcb-tests-net9-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # SEK-G52: WithResult's frozen serialized-commit interop tests invoke the dependency-free Node runner.
      - name: Setup Node for serialized-commit interop runner
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Restore dependencies
        run: |
          dotnet nuget add source -n benchmarknightly https://www.myget.org/F/benchmarkdotnet/api/v3/index.json
          dotnet restore Sekiban.slnx

      - name: dotnet build
        run: |
          dotnet build -c Release -p:GeneratePackageOnBuild=false --verbosity minimal -m:1

      - name: Verify DCB Orleans version authorities
        run: |
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/run-orleans-version-validation.sh \
            --repo-root "$GITHUB_WORKSPACE" --version 10.3.1

      - name: Start pinned DynamoDB Local for G67
        run: |
          docker run --rm -d --name sekiban-g67-dynamodb-local -p 18000:8000 \
            amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1 \
            -jar DynamoDBLocal.jar -inMemory -sharedDb
          for attempt in $(seq 1 30); do
            http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/ || true)"
            if [ "$http_code" != "000" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs sekiban-g67-dynamodb-local
          exit 1

      - name: Audit native apply binding cases on PostgreSQL and SQL Server (net9.0)
        run: |
          trx_dir="$RUNNER_TEMP/g73-materialized-view-trx/net9"
          mkdir -p "$trx_dir"
          dotnet test dcb/tests/Sekiban.Dcb.MaterializedView.MultiProvider.Tests/Sekiban.Dcb.MaterializedView.MultiProvider.Tests.csproj -c Release --no-build -f net9.0 --filter 'FullyQualifiedName~PostgresMvFreshProjectorApplyTests|FullyQualifiedName~PostgresMvG73AcceptanceTests' --logger 'trx;LogFileName=mv-postgres-net9.trx' --results-directory "$trx_dir" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.MaterializedView.MultiProvider.Tests/Sekiban.Dcb.MaterializedView.MultiProvider.Tests.csproj -c Release --no-build -f net9.0 --filter 'FullyQualifiedName~SqlServerMvFreshProjectorApplyTests|FullyQualifiedName~SqlServerMvG73AcceptanceTests' --logger 'trx;LogFileName=mv-sqlserver-net9.trx' --results-directory "$trx_dir" -- RunConfiguration.MaxCpuCount=1
          ./eng/audit-mv-trx-results.sh --trx-dir "$trx_dir" --manifest eng/materialized-view-required-cases.txt --tfm net9.0
          swap_dir="$(mktemp -d)"
          cp "$trx_dir"/* "$swap_dir"/
          mv "$swap_dir/mv-postgres-net9.trx" "$swap_dir/postgres.tmp.trx"
          mv "$swap_dir/mv-sqlserver-net9.trx" "$swap_dir/mv-postgres-net9.trx"
          mv "$swap_dir/postgres.tmp.trx" "$swap_dir/mv-sqlserver-net9.trx"
          if ./eng/audit-mv-trx-results.sh --trx-dir "$swap_dir" --manifest eng/materialized-view-required-cases.txt --tfm net9.0; then
            echo 'ERROR: swapped provider TRX unexpectedly passed the class-qualified audit'
            exit 1
          else
            echo 'swapped provider TRX correctly rejected by class-qualified audit'
          fi

      - name: dotnet test DCB projects sequentially (net9.0)
        run: |
          dotnet test dcb/tests/Sekiban.Dcb.Orleans.Tests/Sekiban.Dcb.Orleans.Tests.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.WithResult.Tests/Sekiban.Dcb.WithResult.Tests.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.WithoutResult.Tests/Sekiban.Dcb.WithoutResult.Tests.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.Postgres.Tests/Sekiban.Dcb.Postgres.Tests.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.MaterializedView.Tests/Sekiban.Dcb.MaterializedView.Tests.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.MaterializedView.Postgres.Tests/Sekiban.Dcb.MaterializedView.Postgres.Tests.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.MaterializedView.MultiProvider.Tests/Sekiban.Dcb.MaterializedView.MultiProvider.Tests.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1
          dotnet test dcb/tests/Sekiban.Dcb.BlobStorage.AzureStorage.Unit/Sekiban.Dcb.BlobStorage.AzureStorage.Unit.csproj -c Release --no-build -f net9.0 --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.MaxCpuCount=1

      - name: Stop pinned DynamoDB Local
        if: always()
        run: docker rm -f sekiban-g67-dynamodb-local || true

      - name: Verify 10.14.1 materialized-view binary consumer without rebuild
        run: |
          dotnet build dcb/tests/Sekiban.Dcb.MaterializedView.BinaryConsumer/Sekiban.Dcb.MaterializedView.BinaryConsumer.csproj -c Release --no-restore -f net9.0
          dotnet dcb/tests/Sekiban.Dcb.MaterializedView.ApiSurfaceVerifier/bin/Release/net9.0/Sekiban.Dcb.MaterializedView.ApiSurfaceVerifier.dll dcb/tests/Sekiban.Dcb.MaterializedView.BinaryConsumer/bin/Release/net9.0/Sekiban.Dcb.MaterializedView.dll dcb/src/Sekiban.Dcb.MaterializedView/bin/Release/net9.0/Sekiban.Dcb.MaterializedView.dll
          cp dcb/src/Sekiban.Dcb.MaterializedView/bin/Release/net9.0/Sekiban.Dcb.MaterializedView.dll dcb/tests/Sekiban.Dcb.MaterializedView.BinaryConsumer/bin/Release/net9.0/
          dotnet dcb/tests/Sekiban.Dcb.MaterializedView.BinaryConsumer/bin/Release/net9.0/Sekiban.Dcb.MaterializedView.BinaryConsumer.dll

      - name: Verify current materialized-view consumer
        run: |
          dotnet dcb/tests/Sekiban.Dcb.MaterializedView.NewVersionConsumer/bin/Release/net9.0/Sekiban.Dcb.MaterializedView.NewVersionConsumer.dll

  dcbTestsNet10:
    runs-on: ubuntu-latest
    env:
      SEKIBAN_TAG_STREAM_CONTROLLED_CEILING: '1'
      SEKIBAN_DYNAMODB_LOCAL_ENDPOINT: http://127.0.0.1:18000
    concurrency:
      group: dcb-tests-net10-${{ github.ref }}
      cancel-in-progress: false

    steps:
