name: nuget package release for Pure

on:
  push:
    tags:
      - 'pure-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: pure-release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Detect version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != pure-v* ]]; then
            echo "Unexpected tag format: $TAG"
            exit 1
          fi
          echo "VERSION=${TAG#pure-v}" >> $GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore pure/Sekiban.Pure.slnx

      - name: Build with dotnet
        run: dotnet build pure/Sekiban.Pure.slnx -c Release -p:GeneratePackageOnBuild=false --verbosity minimal -m:1

      - name: Pack NuGet packages
        run: |
          dotnet pack pure/src/Sekiban.Pure/Sekiban.Pure.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.AspNetCore/Sekiban.Pure.AspNetCore.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.CosmosDb/Sekiban.Pure.CosmosDb.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.NUnit/Sekiban.Pure.NUnit.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.Orleans/Sekiban.Pure.Orleans.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.Orleans.NUnit/Sekiban.Pure.Orleans.NUnit.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.Orleans.xUnit/Sekiban.Pure.Orleans.xUnit.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.Dapr/Sekiban.Pure.Dapr.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.Postgres/Sekiban.Pure.Postgres.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.SourceGenerator/Sekiban.Pure.SourceGenerator.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.xUnit/Sekiban.Pure.xUnit.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build
          dotnet pack pure/src/Sekiban.Pure.ReadModel/Sekiban.Pure.ReadModel.csproj -c Release -o out -p:PackageVersion=$VERSION --no-build

      - name: Audit shipped packages for vulnerabilities
        run: ./eng/validate-pure-security-audit.sh --repo-root .

      - name: Validate packed packages
        run: ./eng/validate-pure-packages.sh --repo-root . --dir out --version "$VERSION"

      - name: Compose release body
        run: ./eng/compose-pure-release-body.sh --repo-root . --version "$VERSION" --output out/release-body.md

      - name: Mint short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_APIKEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push out/*.nupkg --api-key "$NUGET_APIKEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.nupkg
          body_path: out/release-body.md
          make_latest: 'false'
  
