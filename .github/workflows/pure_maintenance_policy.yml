name: Validate Sekiban.Pure maintenance policy

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'pure/README.md'
      - 'templates/Sekiban.Pure.Templates/README.md'
      - 'templates/Sekiban.Pure.Templates/content/Sekiban.Orleans.Aspire/Sekiban.README_Pure_For_LLM.md'
      - 'templates/Sekiban.Pure.Templates/content/Sekiban.Dapr.Aspire/Sekiban.README_Pure_For_LLM.md'
      - 'templates/Sekiban.Pure.Templates/content/Sekiban.Dapr.Aspire/README.md'
      - 'docs/llm/**'
      - 'docs/llm_ja/**'
      - 'eng/pure-maintenance-mode/**'
      - 'eng/validate-pure-maintenance-mode.sh'
      - '.github/workflows/pure_maintenance_policy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate canonical maintenance policy and mutants
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/validate-pure-maintenance-mode.sh --repo-root . --self-test
