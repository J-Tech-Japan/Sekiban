name: DCB template packaged-consumer validation

on:
  pull_request:
    paths:
      - 'templates/Sekiban.Dcb.Templates/**'
      - 'dcb/tests/Sekiban.Dcb.TemplateValidation/**'
      - 'dcb/tests/Sekiban.Dcb.Postgres.Tests/run-packaged-consumer.sh'
      - 'dcb/src/**'
      - '.github/workflows/dcb_template_validation.yml'
      - '.github/workflows/packagesDcbTemplate.yml'
      - '.github/workflows/packagesDcb.yml'
      - '.github/workflows/dcb_release_record_check.yml'
      - 'docs/releases/**'
      - 'docs/dcb_llm/20_materialized_view.md'
      - 'docs/dcb_llm/11_storage_providers.md'
      - 'docs/dcb_llm_ja/20_materialized_view.md'
      - 'docs/dcb_llm_ja/11_storage_providers.md'
      - 'CONTRIBUTING.md'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      public_libraries:
        description: Run template consumer against published libraries (required for template record)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  public-library-applicability:
    name: Decide published-library template applicability
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.detect.outputs.applicable }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PUBLIC: ${{ inputs.public_libraries }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUEST_PUBLIC" == true ]]; then
            echo 'applicable=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python3 dcb/tests/Sekiban.Dcb.TemplateValidation/detect-public-library.py
          else
            echo 'applicable=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Published-library template consumer was not requested.'
          fi

  published-library-consumer:
    name: Published-library template consumer
    needs: public-library-applicability
    if: needs.public-library-applicability.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9 carrier SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Setup .NET 10 generated-output SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run template consumer against nuget.org
        run: |
          VERSION="$(bash dcb/tests/Sekiban.Dcb.TemplateValidation/read-template-version.sh --repo-root "$GITHUB_WORKSPACE")"
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/run-packaged-consumer.sh \
            --repo-root "$GITHUB_WORKSPACE" --version "$VERSION"

  packaged-consumer:
    name: Pack, install, generate, restore, build, and test templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9 carrier SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup .NET 10 generated-output SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from the five template authorities
        run: |
          VERSION="$(bash dcb/tests/Sekiban.Dcb.TemplateValidation/read-template-version.sh --repo-root "$GITHUB_WORKSPACE")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pack exact local DCB feed for template consumers
        run: |
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/pack-local-dcb.sh \
            --repo-root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/dcb-local-feed" --version "$VERSION"

      - name: Independent second library pack for determinism
        run: |
          rm -rf "$GITHUB_WORKSPACE/dcb-local-feed-second"
          mkdir -p "$GITHUB_WORKSPACE/dcb-local-feed-second"
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/pack-local-dcb.sh \
            --repo-root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/dcb-local-feed-second" --version "$VERSION"

      - name: Prove library pack determinism
        run: |
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/run-library-pack-determinism.sh \
            --repo-root "$GITHUB_WORKSPACE" \
            --first-feed "$GITHUB_WORKSPACE/dcb-local-feed" \
            --second-feed "$GITHUB_WORKSPACE/dcb-local-feed-second" \
            --version "$VERSION" | tee "$RUNNER_TEMP/library-pack-determinism.log"
          grep -Fxq 'LIBRARY PACK DETERMINISM: 26/26 equal' "$RUNNER_TEMP/library-pack-determinism.log"

      - name: Executable tag-workflow harness
        run: |
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/run-workflow-harness.sh \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Validate packaged consumer path and killing fixtures
        run: |
          dcb/tests/Sekiban.Dcb.TemplateValidation/run-packaged-consumer.sh \
            --repo-root "$GITHUB_WORKSPACE" --feed "$GITHUB_WORKSPACE/dcb-local-feed" --version "$VERSION"

  production-pack-first:
    name: First independent production library pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Log SDK and runner image
        run: |
          dotnet --info
          echo "Runner image: ${ImageOS} ${ImageVersion}"

      - name: Derive version and pack with exact tag-workflow production settings
        run: |
          VERSION="$(bash dcb/tests/Sekiban.Dcb.TemplateValidation/read-template-version.sh --repo-root "$GITHUB_WORKSPACE")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/pack-local-dcb.sh \
            --production --repo-root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/production-feed" --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: production-library-pack
          path: production-feed/*.nupkg
          if-no-files-found: error

  production-pack-second:
    name: Second independent production pack and 26-package comparison
    needs: production-pack-first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Log SDK and runner image
        run: |
          dotnet --info
          echo "Runner image: ${ImageOS} ${ImageVersion}"

      - name: Derive version and pack with exact tag-workflow production settings
        run: |
          VERSION="$(bash dcb/tests/Sekiban.Dcb.TemplateValidation/read-template-version.sh --repo-root "$GITHUB_WORKSPACE")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/pack-local-dcb.sh \
            --production --repo-root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/production-feed" --version "$VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: production-library-pack
          path: first-runner-feed

      - name: Compare all 26 packages from the two runners
        run: |
          bash dcb/tests/Sekiban.Dcb.TemplateValidation/run-library-pack-determinism.sh \
            --repo-root "$GITHUB_WORKSPACE" --version "$VERSION" \
            --first-feed "$GITHUB_WORKSPACE/first-runner-feed" \
            --second-feed "$GITHUB_WORKSPACE/production-feed"

  currency-drift:
    name: Scheduled stable DCB/template currency check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect stable-semver DCB/template drift
        run: dcb/tests/Sekiban.Dcb.TemplateValidation/validate-release-tags.sh --check-drift --repo-root "$GITHUB_WORKSPACE"
